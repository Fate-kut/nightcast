<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b10"><title>Nightcast — watch together</title><link rel="stylesheet" href="css/style.css"></head><body><div class="wrap"><div class="container"><header class="marquee"><p class="mark">NIGHT<span>CAST</span></p><p class="tag">Watch, listen, message and call together.</p></header><main><div class="grid"><section class="card action-card"><div class="icon-badge" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div><div><h1>Start a room</h1><p class="hint">Upload a video or audio file, name the room, then invite your friends.</p></div><input type="text" id="roomNameInput" placeholder="ROOM NAME" maxlength="80" aria-label="Room name"><label class="dropzone" id="dropzone"><input type="file" id="fileInput" accept="video/*,audio/*" hidden><span class="upload-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 16V4m0 0-4 4m4-4 4 4M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg></span><span id="dzText"><strong>Choose a file</strong><br>or drag one here — video or audio</span></label><div class="filename" id="fileName" style="display:none"></div><div class="progress" id="progressWrap" style="display:none"><div id="progressBar"></div></div><button class="btn-primary" id="createBtn" disabled>Create room</button></section><section class="card action-card"><div class="icon-badge" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div><div><h2>Join a room</h2><p class="hint">Enter the code your friend sent you.</p></div><input type="text" id="codeInput" placeholder="ROOM CODE" maxlength="12" aria-label="Room code"><button class="btn-secondary" id="joinBtn">Join room</button></section></div><section class="card rooms-card"><div class="section-head"><div><h2>Your rooms</h2><p class="hint">Rooms you created on this device.</p></div></div><div id="roomsList"></div></section><div class="error-box" id="errorBox"></div></main></div></div><script src="https://cdn.jsdelivr.net/npm/tus-js-client@4.1.0/dist/tus.min.js"></script><script type="module" src="js/home.js"></script></body></html>
